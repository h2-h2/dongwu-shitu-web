<!DOCTYPE html>
<html>
<head>
    <title>识别结果 - 动物识别系统</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 全局重置：移除默认边距和内边距，使用border-box盒模型 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* body样式：页面整体布局和背景 */
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;             /* 浅灰色背景 */
            min-height: 100vh;                /* 最小高度为视口高度 */
            display: flex;                    /* 使用flex布局 */
            align-items: center;              /* 垂直居中 */
            justify-content: center;          /* 水平居中 */
        }
        
        /* .container：主内容容器 */
        .container {
            margin: 30px auto;              /* 上下外边距30px，左右自动居中 */
            background: rgba(255, 255, 255, 0.95);  /* 白色半透明背景（95%不透明度） */
            padding: 40px;                   /* 内边距40px */
            border-radius: 20px;             /* 圆角20px */
            width: 90%;                      /* 宽度占父元素90% */
            max-width: 650px;                /* 最大宽度650px */
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); /* 阴影效果 */
        }
        
        /* h2：页面标题 */
        h2 {
            color: #2e7d32;                  /* 深绿色文字 */
            margin-bottom: 25px;             /* 下边距25px */
            font-size: 28px;                 /* 字体大小28px */
        }
        
        /* .uploaded-img：用户上传的图片样式 */
        .uploaded-img {
            width: 280px;                    /* 图片宽度280px */
            border-radius: 15px;             /* 圆角15px */
            margin: 20px 0;                  /* 上下外边距20px */
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); /* 阴影效果 */
            border: 3px solid #e8f5e9;       /* 浅绿色边框 */
        }
        
        /* table：结果表格样式 */
        table {
            margin: 0 auto;                  /* 居中显示 */
            border-collapse: collapse;       /* 合并单元格边框 */
            width: 100%;                     /* 宽度100% */
            font-size: 16px;                 /* 字体大小16px */
        }
        
        /* th：表格表头单元格 */
        th {
            background: #4CAF50;             /* 绿色背景 */
            color: white;                    /* 白色文字 */
            padding: 14px;                   /* 内边距14px */
            font-weight: 500;                /* 字重500 */
        }
        th:first-child { border-radius: 10px 0 0 0; }  /* 左上角圆角 */
        th:last-child { border-radius: 0 10px 0 0; }   /* 右上角圆角 */
        
        /* td：表格数据单元格 */
        td {
            padding: 14px;                   /* 内边距14px */
            border-bottom: 1px solid #e8f5e9; /* 底部边框线 */
            color: #333;                     /* 深灰色文字 */
        }
        tr:hover td { background: #f1f8e9; }          /* 鼠标悬停时背景变色 */
        
        /* .conf-high：高置信度文字样式 */
        .conf-high { color: #2e7d32; font-weight: bold; }  /* 深绿色粗体 */
        
        /* .conf-low：低置信度文字样式 */
        .conf-low { color: #f44336; font-weight: bold; }   /* 红色粗体 */
        
        /* .btn-back：返回按钮样式 */
        .btn-back {
            display: inline-block;           /* 行内块元素 */
            margin-top: 25px;               /* 上边距25px */
            padding: 14px 35px;             /* 内边距 */
            background: #4CAF50;            /* 绿色背景 */
            color: white;                   /* 白色文字 */
            text-decoration: none;          /* 移除下划线 */
            border-radius: 30px;            /* 圆角30px */
            font-size: 16px;                /* 字体大小16px */
            transition: all 0.3s;           /* 过渡动画0.3秒 */
            box-shadow: 0 4px 15px rgba(76,175,80,0.3); /* 阴影效果 */
        }
        .btn-back:hover {
            background: #388E3C;           /* 鼠标悬停时深绿色背景 */
            transform: translateY(-2px);    /* 向上移动2px */
            box-shadow: 0 6px 20px rgba(76,175,80,0.4); /* 阴影加深 */
        }
        
        /* .summary-box：结果摘要盒子 */
        .summary-box {
            background: #f1f8e9;            /* 浅绿色背景 */
            border-radius: 12px;            /* 圆角12px */
            padding: 20px;                  /* 内边距20px */
            margin-bottom: 25px;            /* 下边距25px */
            border-left: 4px solid #4CAF50; /* 左侧绿色边框 */
        }
        .summary-box p { font-size: 16px; color: #333; line-height: 1.8; }  /* 段落样式 */
        
        /* .highlight：高亮文字样式 */
        .highlight { color: #2e7d32; font-weight: bold; font-size: 18px; }  /* 深绿色粗体18px */
    </style>
</head>
<body>
    <div class="container">
        <h2>识别结果</h2>

        <img class="uploaded-img" src="{{ img_url }}" alt="上传的图片">

        <table>
            <tr>
                <th>模型</th>
                <th>预测结果</th>
                <th>置信度</th>
            </tr>
            <tr>
                <td><strong>MobileNetV2</strong></td>
                <td>{{ label1 }}</td>
                <td><span class="{% if conf1_num|floatformat:1 > '60' %}conf-high{% else %}conf-low{% endif %}">{{ conf1 }}</span></td>
            </tr>
            <tr>
                <td><strong>EfficientNetB0</strong></td>
                <td>{{ label2 }}</td>
                <td><span class="{% if conf2_num|floatformat:1 > '60' %}conf-high{% else %}conf-low{% endif %}">{{ conf2 }}</span></td>
            </tr>
        </table>

        <div class="summary-box">
            <p>
                MobileNetV2 预测：<span class="highlight">{{ label1 }}</span>，
                置信度 <span class="highlight">{{ conf1 }}</span>
            </p>
            <p>
                EfficientNetB0 预测：<span class="highlight">{{ label2 }}</span>，
                置信度 <span class="highlight">{{ conf2 }}</span>
            </p>
        </div>

        <a class="btn-back" href="/">继续识别</a>
    </div>
</body>
</html>
